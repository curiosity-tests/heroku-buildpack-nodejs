  metrics-test:
    strategy:
      fail-fast: false
      matrix:
        # check the minimum node version supported by the metrics script and the latest node version
        # (assumes the versions between have backwards-compatible APIs)
        include:
        - version: 14.10.0
          mocha: 10.x
        - version: latest
          mocha: 11.x
    name: Test Metrics (${{ matrix.version }})
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout code
      uses: crashappsec/action-checkout@e9ff46a65f6403d9d88b87d248c3dfa41550ec75
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
        observables_continue_on_error: false
        lfs: false
